[project]
name = "self-agent"
version = "0.1.0"
description = "随心记：通过聊天记录生活，自动整理，在需要时找回。"
requires-python = ">=3.12"
dependencies = ["deepagents>=0.5,<0.6", "fastapi>=0.115", "uvicorn>=0.34", "langchain-openai>=1", "pydantic-settings>=2", "itsdangerous>=2", "httpx>=0.28"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
